spring.application.name=api-gateway
server.port=8080

# Config Server Configuration
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.enabled=true
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=false

# Eureka Client Configuration
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Gateway Routes Configuration
spring.cloud.gateway.server.webmvc.routes[0].id=room-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://room-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/rooms/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webmvc.routes[1].id=member-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://member-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/members/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webmvc.routes[2].id=reservation-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://reservation-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/reservations/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=0

# Enable discovery locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
